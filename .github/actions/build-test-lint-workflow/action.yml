name: Build, Test, and Lint
description: >-
  Runs build, test, typecheck, and lint steps for the package. Used by CI and
  publish workflows to verify the package before publishing.

runs:
  using: composite
  steps:

    - name: Set up Node.js
      uses: actions/setup-node@main
      with:
        node-version-file: .nvmrc
        registry-url: https://registry.npmjs.org
        cache: npm

    - name: Install dependencies
      run: npm install
      shell: bash

    - name: Test package
      run: npm test
      shell: bash

    - name: Typecheck
      run: npm run typecheck
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Build package
      run: npm run build
      shell: bash
