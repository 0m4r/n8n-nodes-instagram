name: Publish to npm

on:
  push:
    tags:
      - "v*" # Usually triggered by version tags

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # 1. CRITICAL: This permissions block allows GitHub to mint the OIDC token
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build --if-present

      - name: Publish to npm
        # 2. No NODE_AUTH_TOKEN is passed anymore!
        # npm automatically detects and uses the GitHub OIDC token.
        run: npm publish --access public
