name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for npm Trusted Publishers (OIDC)
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # <-- CRITICAL: Gives n8n-node access to full tag history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        # npm publish will now successfully trigger n8n-node prerelease
        # because the git history/tags are fully present.
