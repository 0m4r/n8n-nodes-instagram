name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Increase job timeout (minutes). Repo/org settings may cap this — check Settings → Actions → General → Workflow timeout.
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Test package
        run: npm test
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Test package
        run: npm test
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          # Use a single deterministic install; npm ci is preferred when package-lock.json exists
          npm ci
      - name: Test
        # A non-zero npm test exit code fails this required workflow step.
        run: npm test
      - name: Typecheck (bounded)
        # Use timeout to prevent infinite hang; adjust seconds as needed
        run: |
          npm run typecheck
      - name: Lint (bounded)
        # Use timeout to prevent infinite hang; adjust seconds as needed
        run: |
          npm run lint

      - name: Run build (bounded)
        run: |
          npm run build
