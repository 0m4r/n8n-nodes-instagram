name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Increase job timeout (minutes). Repo/org settings may cap this — check Settings → Actions → General → Workflow timeout.
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          # Use a single deterministic install; npm ci is preferred when package-lock.json exists
          npm ci
      - name: Typecheck (bounded)
        # Use timeout to prevent infinite hang; adjust seconds as needed
        run: |
          npm run typecheck
      - name: Lint (bounded)
        # Use timeout to prevent infinite hang; adjust seconds as needed
        run: |
          npm run lint

      - name: Run build (bounded)
        run: |
          npm run build
