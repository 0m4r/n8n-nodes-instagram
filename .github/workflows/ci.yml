name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'

      - name: Install dependencies
        run: npm install
          
      - name: Test
        run: npm test
        
      - name: Typecheck
        run: npm run typecheck
          
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
